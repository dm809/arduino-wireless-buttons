# Одна кнопка «Run workflow» — публикует обновления на сайт electron
name: Deploy to electron site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron-updates/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.ELECTRON_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Добавьте секрет ELECTRON_GH_TOKEN"
            exit 1
          fi

      - name: Push to dm809/electron
        env:
          GH_TOKEN: ${{ secrets.ELECTRON_GH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/dm809/electron.git" electron
          cd electron
          cp ../electron-updates/js/reviews-data.js js/reviews-data.js
          cp ../electron-updates/data/reviews.json data/reviews.json
          cp ../electron-updates/js/config.js js/config.js
          cp ../electron-updates/js/i18n.js js/i18n.js
          cp ../electron-updates/js/main.js js/main.js
          cp ../electron-updates/css/style.css css/style.css
          cp ../electron-updates/index.html index.html
          mkdir -p images/partners
          cp -r ../electron-updates/images/partners/. images/partners/

          # YouTube-ссылки в HTML (fallback до загрузки JS)
          sed -i 's|https://www.youtube.com/@electronica-u1f|https://www.youtube.com/@elektron_dmitrii|g' index.html
          sed -i 's|style.css?v=[0-9]*|style.css?v=39|g' index.html
          sed -i 's|config.js?v=[0-9]*|config.js?v=39|g' index.html
          sed -i 's|reviews-data.js?v=[0-9]*|reviews-data.js?v=39|g' index.html
          sed -i 's|i18n.js?v=[0-9]*|i18n.js?v=39|g' index.html
          sed -i 's|main.js?v=[0-9]*|main.js?v=39|g' index.html
          sed -i 's|reviews.js?v=[0-9]*|reviews.js?v=39|g' index.html
          sed -i 's|site-reviews-store.js?v=[0-9]*|site-reviews-store.js?v=39|g' index.html

          # Фото загружены с неправильными именами — переименовать под config.js
          cd images
          [ -f 'gallery-work-3 (1).jpg' ] && git mv 'gallery-work-3 (1).jpg' gallery-work-1.jpg
          [ -f 'gallery-work-3 (2).jpg' ] && git mv 'gallery-work-3 (2).jpg' gallery-work-2.jpg
          [ -f 'gallery-work- (3).jpg' ] && git mv 'gallery-work- (3).jpg' gallery-work-3.jpg
          [ -f 'gallery-work- (5).jpg' ] && git mv 'gallery-work- (5).jpg' gallery-work-5.jpg
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/reviews-data.js data/reviews.json js/config.js js/i18n.js js/main.js css/style.css index.html images/
          git diff --staged --quiet && echo "Nothing to change" && exit 0
          git commit -m "Телефоны по языкам, UA в шапке, украинский язык"
          git push origin main
