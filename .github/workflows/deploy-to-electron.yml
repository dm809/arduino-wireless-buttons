# Одна кнопка «Run workflow» — публикует обновления на сайт electron
name: Deploy to electron site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron-updates/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.ELECTRON_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Добавьте секрет ELECTRON_GH_TOKEN"
            exit 1
          fi

      - name: Push to dm809/electron
        env:
          GH_TOKEN: ${{ secrets.ELECTRON_GH_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/dm809/electron.git" electron
          cd electron
          cp ../electron-updates/js/reviews-data.js js/reviews-data.js
          cp ../electron-updates/data/reviews.json data/reviews.json
          cp ../electron-updates/js/config.js js/config.js
          mkdir -p .github/workflows images
          cp ../electron-updates/.github/workflows/supabase-keepalive.yml .github/workflows/
          if [ -d ../electron-updates/images ]; then
            cp ../electron-updates/images/* images/ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing to change" && exit 0
          git commit -m "10 новых отзывов, fix Supabase, автопинг"
          git push origin main
